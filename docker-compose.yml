services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # port SMTP, dipakai aplikasi untuk mengirim email
      - "8025:8025"   # port dashboard web, dibuka di browser
    restart: unless-stopped

volumes:
  pgdata: